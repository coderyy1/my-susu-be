version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: sh -c "npx prisma generate && npm run dev"

  db:
    image: mysql:8
    restart: always
    env_file:
      - .env
    ports:
    - "3307:3306"
    volumes:
    - db_data:/var/lib/mysql

volumes:
  db_data: